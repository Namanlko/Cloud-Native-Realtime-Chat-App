apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-server
  namespace: chat-app
spec:
  # Kept at 1: chat state (messages, online users) lives in-memory in this
  # process. With replicas > 1 and no shared pub/sub (e.g. a Redis adapter
  # for Socket.IO), users landing on different pods wouldn't see each
  # other's messages. See README "Scaling note" before raising this.
  replicas: 1
  selector:
    matchLabels:
      app: chat-server
  template:
    metadata:
      labels:
        app: chat-server
    spec:
      containers:
      - name: chat-server
        image: ${ECR_REGISTRY}/chat-server:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: chat-server
  namespace: chat-app
spec:
  selector:
    app: chat-server
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP
