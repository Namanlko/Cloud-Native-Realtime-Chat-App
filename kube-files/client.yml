apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-client
  namespace: game
spec:
  replicas: 2
  selector:
    matchLabels:
      app: game-client
  template:
    metadata:
      labels:
        app: game-client
    spec:
      containers:
      - name: game-client
        image: 040494736757.dkr.ecr.us-east-2.amazonaws.com/game-client:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: game-client
  namespace: game
spec:
  selector:
    app: game-client
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: NodePort
